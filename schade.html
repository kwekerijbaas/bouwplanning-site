
<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d4e8f">
<title>Schade-inventarisatie Kwekerij Baas</title>
<style>
:root{
  --groen:#1d4e8f; --groen-licht:#4d8fd1; --bg:#eef2f7; --kaart:#ffffff;
  --tekst:#1b2a24; --grijs:#6c757d; --lijn:#e3e7e5; --rood:#c1442e; --oranje:#f2a541; --blauw:#1d70b8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--tekst);font-size:15px;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font:inherit}
#topbar{position:sticky;top:0;z-index:30;background:var(--groen);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px}
#topbar h1{font-size:16px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .wie{font-size:12px;opacity:.85}
#tabs{position:sticky;top:44px;z-index:29;display:flex;background:var(--kaart);border-bottom:1px solid var(--lijn);overflow-x:auto}
#tabs button{flex:1;min-width:70px;padding:10px 4px;font-size:13px;color:var(--grijs);border-bottom:3px solid transparent;white-space:nowrap}
#tabs button.actief{color:var(--groen);border-bottom-color:var(--groen);font-weight:600}
main{padding:12px;max-width:1100px;margin:0 auto;padding-bottom:50px}
.kaart{background:var(--kaart);border:1px solid var(--lijn);border-radius:10px;padding:12px;margin-bottom:10px}
.kaart h2{font-size:14px;margin-bottom:8px;color:var(--groen)}
.stil{color:var(--grijs);font-size:12px}
.knop{background:var(--groen);color:#fff;padding:8px 14px;border-radius:8px;font-size:14px;font-weight:600}
.knop.licht{background:#e8f0ec;color:var(--groen)}
.knop.klein{padding:5px 10px;font-size:12px}
.chip{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;color:#fff;white-space:nowrap}
.chip.schade{background:var(--rood)}
.chip.gewas{background:var(--oranje)}
.chip.steun{background:#98a2a0}
input[type=text],input[type=number],input[type=date],select,textarea{border:1px solid var(--lijn);border-radius:7px;padding:7px 8px;background:#fff;width:100%}
textarea{resize:vertical;min-height:50px}
label.veld{display:block;font-size:12px;color:var(--grijs);margin:8px 0 3px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:10px}
.kpi{background:var(--kaart);border:1px solid var(--lijn);border-radius:10px;padding:10px;text-align:center}
.kpi .n{font-size:22px;font-weight:700;color:var(--groen)}
.kpi .l{font-size:11px;color:var(--grijs)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.filters select,.filters input{width:auto;min-width:110px}
.item{background:var(--kaart);border:1px solid var(--lijn);border-radius:10px;margin-bottom:8px;overflow:hidden}
.item .kop{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;flex-wrap:wrap}
.item .kop .id{font-weight:700;font-size:12px;color:var(--groen);min-width:56px}
.item .kop .oms{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .kop .datum{font-size:12.5px;color:#0f2d4d;background:#dce9f7;font-weight:700;white-space:nowrap;padding:3px 9px;border-radius:8px}
.stadium{font-size:11px;color:var(--grijs);white-space:nowrap;padding:3px 8px;background:#eef1ef;border-radius:8px}
.knop.volgende{background:#e8f0ec;color:var(--groen);font-size:11px;padding:6px 9px;white-space:nowrap;border-radius:8px;font-weight:600}
.pills{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.pill{padding:6px 10px;border-radius:14px;font-size:12px;background:#eef1ef;color:var(--grijs);border:1px solid var(--lijn)}
.pill.klaar{background:#e3f3ea;color:var(--groen);border-color:#cdeadb}
.pill.actief{background:var(--groen);color:#fff;font-weight:600;border-color:var(--groen)}
.bchips{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.bchip{padding:4px 9px;border-radius:12px;font-size:11px;background:#eef1ef;color:var(--groen);border:1px solid var(--lijn)}
.bchip.gekozen{background:var(--groen);color:#fff;font-weight:600;border-color:var(--groen)}
.loc-wolk{margin-top:5px;display:flex;flex-direction:column;gap:4px}
.loc-groep{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.loc-kop{font-size:10.5px;font-weight:700;color:var(--grijs);min-width:38px;letter-spacing:.02em}
.bedrijf-nieuw{display:flex;gap:6px;margin-top:6px}
.bedrijf-nieuw input{flex:1}
.kpi.warn{border-color:#f2a541;background:#fff8ec}
.kpi.warn .n{color:#c1442e}
.stadium.nogcat{background:#fdf0dd;color:#a15c00;font-weight:600}
.vervallen-toggle{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--grijs);white-space:nowrap}
.vervallen-toggle input{width:auto}
.traject-kies{margin-top:6px}
.traject-knoppen{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:6px}
@media(max-width:560px){.traject-knoppen{grid-template-columns:1fr}}
.tknop{border:1px solid var(--lijn);border-radius:10px;padding:10px 8px;font-size:12.5px;font-weight:600;text-align:center;background:#fafbfa;display:flex;flex-direction:column;gap:4px;line-height:1.3}
.tknop .tsub{display:block;font-size:10.5px;font-weight:400;color:var(--grijs)}
.tknop.regulier{border-color:#c9d6c2}
.tknop.regulier:hover{background:#eef5ea}
.tknop.verhaal{border-color:#e6c2a8}
.tknop.verhaal:hover{background:#fbf1e8}
.tknop.indienen{border-color:#b9cfe3}
.tknop.indienen:hover{background:#eaf2fa}
.tknop-mini{border:1px dashed var(--lijn);border-radius:8px;padding:7px 10px;font-size:11.5px;font-weight:600;text-align:center;background:#f4f8fb;color:var(--blauw);margin-top:8px;width:100%}
.tknop-mini:hover{background:#e8f1f8}
.override-cat{font-size:11px;color:var(--blauw);text-decoration:underline;margin-top:4px;margin-left:10px;display:inline-block}
.traject-actief{margin-top:6px}
.traject-badge{display:inline-block;padding:4px 10px;border-radius:8px;font-size:12px;font-weight:600;color:#fff;margin-bottom:6px}
.traject-badge.regulier{background:#6c9a5a}
.traject-badge.verhaal_derden{background:#c1752e}
.traject-badge.indienen_verzekeraar{background:var(--groen)}
.traject-badge.al_verwerkt_betaald{background:var(--blauw)}
.wijzig-cat{font-size:11px;color:var(--grijs);text-decoration:underline;margin-top:4px;display:inline-block}
.detail{border-top:1px solid var(--lijn);padding:12px;display:none;background:#fafbfa}
.detail.open{display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.foto-ref{font-size:11px;color:var(--grijs);word-break:break-all;background:#f2f4f3;border-radius:6px;padding:6px 8px;margin-top:4px}
.foto-thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.fotowrap{position:relative;display:inline-flex}
.foto-dl{position:absolute;right:3px;bottom:3px;background:rgba(255,255,255,.92);border:1px solid var(--lijn);border-radius:6px;font-size:12px;line-height:1;padding:3px 6px;color:var(--groen);font-weight:700}
.foto-dl:hover{background:#fff;color:#000}
.foto-thumbs a{display:block;width:64px;height:64px;border-radius:6px;overflow:hidden;border:1px solid var(--lijn);flex:none}
.foto-thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.foto-thumbs .vid-chip{width:auto;height:auto;padding:6px 8px;font-size:11px;color:var(--blauw);background:#eef4fa;display:flex;align-items:center}
.upload-rij{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.upload-status{font-size:11px;color:var(--grijs)}
#lightbox{position:fixed;inset:0;background:rgba(10,14,12,.92);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
#lightbox.open{display:flex}
#lightbox .lb-stage{max-width:92vw;max-height:78vh;display:flex;align-items:center;justify-content:center}
#lightbox .lb-stage img,#lightbox .lb-stage video{max-width:92vw;max-height:78vh;border-radius:8px;display:block}
#lightbox .lb-topbar{position:absolute;top:14px;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:0 18px;color:#fff;font-size:13px}
#lightbox .lb-close{background:rgba(255,255,255,.15);color:#fff;border-radius:8px;padding:6px 12px;font-size:18px;line-height:1}
#lightbox .lb-nav{position:absolute;top:50%;margin-top:-22px;background:rgba(255,255,255,.15);color:#fff;border-radius:50%;width:44px;height:44px;font-size:22px;display:flex;align-items:center;justify-content:center}
#lightbox .lb-prev{left:10px}
#lightbox .lb-next{right:10px}
#lightbox .lb-counter{color:#fff;font-size:12px;opacity:.85}
.foto-thumbs a{cursor:pointer}
.chip.cat-badge{background:#5c6b7a}
.stadium.status-gereed{background:#e3f3ea;color:#1d4e8f;font-weight:600}
.stadium.status-verhaal{background:#fdf0dd;color:#a15c00;font-weight:600}
.gereed-toggle{border:1px solid var(--lijn);background:#fff;color:var(--grijs);margin-left:auto}
.gereed-toggle.aan{background:#1d4e8f;color:#fff;border-color:#1d4e8f}
.gereed-toggle.nood{background:#fdf0dd;color:#a15c00;border-color:#e8c58a;font-weight:600}
.stadium.status-nood{background:#fdf0dd;color:#a15c00;font-weight:600}
.pb-item{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid var(--lijn);flex-wrap:wrap;font-size:13px;cursor:pointer}
.pb-item:last-child{border-bottom:none}
.opslaan-rij{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
#login{position:fixed;inset:0;background:var(--groen);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
#login .paneel{background:#fff;border-radius:14px;padding:26px 22px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px}
#login h1{font-size:19px;color:var(--groen)}
#login .fout{color:var(--rood);font-size:13px;display:none}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:120;max-width:90vw}
#toast.zien{opacity:1}
.leeg{color:var(--grijs);font-size:13px;padding:8px 0}
details.log summary{font-size:13px;color:var(--grijs);cursor:pointer;padding:4px 0}
details.log .regel{font-size:12px;color:var(--grijs);display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid var(--lijn)}
@media(min-width:700px){ #tabs button{flex:0 0 auto;padding:10px 22px} }
</style>
</head>
<body>
<div id="login" style="display:none">
  <div class="paneel">
    <h1>🛡️ Schade-inventarisatie<br>Kwekerij Baas</h1>
    <label>Toegangscode<br><input type="password" id="lg-code" style="width:100%" autocomplete="current-password"></label>
    <label>Wie ben je?<br>
      <select id="lg-wie" style="width:100%">
        <option>Dieter</option><option>Jarno</option><option>Hettie</option><option>Fimme</option>
        <option>Mariet</option><option>Jeroen</option><option>Manuela</option><option>Patrick</option>
        <option>Jacob</option><option>Albert</option><option>Mariska</option><option>Dennis</option>
        <option>Rick</option><option>Anders</option>
      </select></label>
    <div class="fout" id="lg-fout">Code klopt niet, probeer opnieuw.</div>
    <button class="knop" id="lg-knop">Inloggen</button>
  </div>
</div>
<div id="topbar"><h1>🛡️ Schade-inventarisatie</h1><span class="wie" id="tb-wie"></span></div>
<div id="tabs"></div>
<main id="app"></main>
<div id="toast"></div>
<div id="lightbox"><div class="lb-topbar"><span class="lb-counter" id="lb-counter"></span><button type="button" class="lb-close" id="lb-dl" title="Download dit bestand">⬇</button><button type="button" class="lb-close" id="lb-close">✕</button></div><button type="button" class="lb-nav lb-prev" id="lb-prev">‹</button><div class="lb-stage" id="lb-stage"></div><button type="button" class="lb-nav lb-next" id="lb-next">›</button></div>
<script>
'use strict';
const API = 'https://hlgvtxcwbhrbbcozvsen.supabase.co/functions/v1/schade/api';
const FOTO_BASE = 'https://hlgvtxcwbhrbbcozvsen.supabase.co/storage/v1/object/public/schade-fotos/';
function canonBedrijven(){
  // gedeelde bedrijvenlijst uit de bouwplanning-app (tabel rp_bedrijf) — tap-chips
  return (S.data && S.data.bedrijven || []).map(b=>b.naam);
}
function alleBedrijven(){
  // datalist-suggesties: canonieke lijst + historische vrije-tekst waarden (compatibiliteit oudere items)
  const set = new Set(canonBedrijven());
  (S.data && S.data.items || []).forEach(i=>{ if(i.uitgevoerd_door) set.add(String(i.uitgevoerd_door).trim()); });
  return Array.from(set).filter(Boolean).sort((a,b)=>a.localeCompare(b));
}
function fotoLijst(i){
  return String(i.foto_referenties||'').split(',').map(s=>s.trim()).filter(Boolean);
}
function isAfbeelding(naam){
  return /[.](jpg|jpeg|png|webp)$/i.test(naam);
}
function fotoThumbs(i){
  const namen = fotoLijst(i);
  if(!namen.length) return '<div class="foto-ref">📎 geen foto-referentie</div>';
  let h = '<div class="foto-thumbs">'+namen.map((n,idx)=>{
    const url = FOTO_BASE+encodeURIComponent(n);
    const dl = '<button type="button" class="foto-dl" data-dlfoto="'+esc(n)+'" title="Download '+esc(n)+'">⬇</button>';
    if(isAfbeelding(n)) return '<span class="fotowrap"><a href="'+url+'" data-lightbox="'+i.id+'" data-idx="'+idx+'" title="'+esc(n)+'"><img src="'+url+'" loading="lazy"></a>'+dl+'</span>';
    return '<span class="fotowrap"><a class="vid-chip" href="'+url+'" data-lightbox="'+i.id+'" data-idx="'+idx+'">🎬 '+esc(n)+'</a>'+dl+'</span>';
  }).join('')+'</div>';
  if(namen.length>1) h += '<button type="button" class="knop licht klein" data-dlalle="'+i.id+'" style="margin-top:6px">⬇ Alle '+namen.length+' bestanden downloaden</button>';
  return h;
}
function downloadBestand(naam){
  const a = document.createElement('a');
  a.href = FOTO_BASE+encodeURIComponent(naam)+'?download='+encodeURIComponent(naam);
  a.download = naam;
  a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}
function downloadAlle(itemId){
  const i = S.data.items.find(x=>x.id===itemId);
  if(!i) return;
  const namen = fotoLijst(i);
  if(!namen.length){ toast('Geen bestanden bij dit item'); return; }
  toast(namen.length+' bestanden worden gedownload…');
  namen.forEach((n,idx)=>setTimeout(()=>downloadBestand(n), idx*400));
}
function printRij(label,waarde){
  const v = (waarde==null || waarde==='') ? '—' : waarde;
  return '<tr><th>'+esc(label)+'</th><td>'+esc(v)+'</td></tr>';
}
function printItem(id){
  const i = S.data.items.find(x=>x.id===id);
  if(!i){ toast('Item niet gevonden'); return; }
  const w = window.open('', '_blank');
  if(!w){ toast('Sta pop-ups toe om de PDF te maken'); return; }
  const namen = fotoLijst(i);
  const fotos = namen.filter(isAfbeelding);
  const overig = namen.filter(n=>!isAfbeelding(n));
  const titel = 'Schade ' + String(i.schade_id||'') + ' - ' + String(i.locatie||'onbekende locatie');
  const nu = new Date();
  const gemaakt = ('0'+nu.getDate()).slice(-2)+'-'+('0'+(nu.getMonth()+1)).slice(-2)+'-'+nu.getFullYear();

  let h = '<!doctype html><html lang="nl"><head><meta charset="utf-8"><title>'+esc(titel)+'</title><style>'
    + '@page{size:A4;margin:14mm}'
    + 'body{font-family:Arial,Helvetica,sans-serif;color:#1b2a24;font-size:12px;margin:0}'
    + 'h1{font-size:17px;margin:0 0 2px;color:#1d4e8f}'
    + '.sub{font-size:11px;color:#666;margin-bottom:12px}'
    + '.balk{border-bottom:2px solid #1d4e8f;margin-bottom:10px;padding-bottom:8px}'
    + 'table{width:100%;border-collapse:collapse;margin-bottom:12px}'
    + 'th,td{border:1px solid #d8dee6;padding:5px 7px;text-align:left;vertical-align:top;font-size:12px}'
    + 'th{background:#eef2f7;width:33%;font-weight:600;color:#33455c}'
    + 'h2{font-size:13px;color:#1d4e8f;margin:14px 0 6px}'
    + '.fotos{display:flex;flex-wrap:wrap;gap:8px}'
    + '.fw{width:48%;page-break-inside:avoid;border:1px solid #d8dee6;padding:5px;box-sizing:border-box}'
    + '.fw img{width:100%;height:auto;display:block}'
    + '.fw .cap{font-size:9px;color:#777;margin-top:3px;word-break:break-all}'
    + '.vt{font-size:11px;color:#444;margin:2px 0}'
    + '.voet{margin-top:16px;padding-top:6px;border-top:1px solid #d8dee6;font-size:9.5px;color:#888}'
    + '</style></head><body onload="window.print()">';

  h += '<div class="balk"><h1>Schade-onderbouwing ' + esc(i.schade_id||'') + '</h1>'
    + '<div class="sub">Kwekerij Baas - hagelschade 27/28-06-2026</div></div>';

  h += '<table>'
    + printRij('Schade-ID', i.schade_id)
    + printRij('Datum melding', fmtD(i.datum))
    + printRij('Locatie', i.locatie)
    + printRij('Schadecategorie', i.schadecategorie)
    + printRij('Polis', i.polis)
    + printRij('Reparatie uitgevoerd door', i.uitgevoerd_door)
    + printRij('Verhaalbaar op derden', i.verhaal_op_derden ? ('Ja' + (i.verhaal_bedrijf ? ' - ' + i.verhaal_bedrijf : '')) : 'Nee')
    + printRij('Status', i.gereed ? 'Definitief hersteld / afgehandeld' : (i.nood_hersteld ? 'Noodreparatie uitgevoerd - definitief herstel nog open' : 'Open'))
    + '</table>';

  h += '<h2>Omschrijving / duiding</h2><table><tr><td>'+esc(i.omschrijving||'—')+'</td></tr></table>';
  if(i.opmerkingen) h += '<h2>Opmerkingen</h2><table><tr><td>'+esc(i.opmerkingen)+'</td></tr></table>';

  h += '<h2>Foto-onderbouwing ('+fotos.length+' foto'+(fotos.length===1?'':'s')+')</h2>';
  if(fotos.length){
    h += '<div class="fotos">' + fotos.map(n=>{
      const url = FOTO_BASE + encodeURIComponent(n);
      return '<div class="fw"><img src="'+url+'"><div class="cap">'+esc(n)+'</div></div>';
    }).join('') + '</div>';
  } else {
    h += '<div class="vt">Geen foto-onderbouwing beschikbaar bij dit item.</div>';
  }
  if(overig.length){
    h += '<h2>Overige media (video, niet afdrukbaar)</h2>'
      + overig.map(n=>'<div class="vt">- '+esc(n)+' : '+esc(FOTO_BASE+encodeURIComponent(n))+'</div>').join('');
  }

  h += '<div class="voet">Gegenereerd op '+esc(gemaakt)+' door '+esc(S.wie||'onbekend')
    + ' - bron: schade-inventarisatie Kwekerij Baas (baaskwekerij.nl/schade.html)'
    + ' - laatst gewijzigd door '+esc(i.laatst_gewijzigd_door||'—')
    + (i.updated_at ? (' op '+esc(String(i.updated_at).slice(0,16).replace('T',' '))) : '')
    + '</div>';

  h += '</body></html>';
  w.document.write(h);
  w.document.close();
}
function lbMediaHtml(naam){
  const url = FOTO_BASE+encodeURIComponent(naam);
  if(isAfbeelding(naam)) return '<img src="'+url+'" alt="'+esc(naam)+'">';
  return '<video src="'+url+'" controls autoplay></video>';
}
const LB = { items:[], idx:0 };
function renderLightbox(){
  const stage=document.getElementById('lb-stage');
  const counter=document.getElementById('lb-counter');
  const prev=document.getElementById('lb-prev');
  const next=document.getElementById('lb-next');
  if(!LB.items.length){ stage.innerHTML=''; return; }
  stage.innerHTML = lbMediaHtml(LB.items[LB.idx]);
  counter.textContent = (LB.idx+1)+' / '+LB.items.length;
  const meer = LB.items.length>1;
  prev.style.display = meer?'flex':'none';
  next.style.display = meer?'flex':'none';
}
function openLightbox(items, idx){
  LB.items = items; LB.idx = idx||0;
  document.getElementById('lightbox').classList.add('open');
  renderLightbox();
}
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lb-stage').innerHTML='';
  LB.items=[]; LB.idx=0;
}
function lbPrev(){ if(!LB.items.length) return; LB.idx=(LB.idx-1+LB.items.length)%LB.items.length; renderLightbox(); }
function lbNext(){ if(!LB.items.length) return; LB.idx=(LB.idx+1)%LB.items.length; renderLightbox(); }
function initLightbox(){
  document.getElementById('lb-close').onclick=closeLightbox;
  document.getElementById('lb-dl').onclick=()=>{ if(LB.items.length) downloadBestand(LB.items[LB.idx]); };
  document.getElementById('lb-prev').onclick=lbPrev;
  document.getElementById('lb-next').onclick=lbNext;
  document.getElementById('lightbox').onclick=(e)=>{ if(e.target.id==='lightbox') closeLightbox(); };
  document.addEventListener('keydown',(e)=>{
    if(!document.getElementById('lightbox').classList.contains('open')) return;
    if(e.key==='Escape') closeLightbox();
    else if(e.key==='ArrowLeft') lbPrev();
    else if(e.key==='ArrowRight') lbNext();
  });
}

    body:JSON.stringify(Object.assign({code:S.code,wie:S.wie},body))});
  if(r.status===401) throw {auth:true};

function matchFilter(i){
  if(S.filterStatus==='' && i.gereed) return false;
  if(S.filterStatus==='open' && (i.gereed || i.uitgevoerd_door)) return false;
  if(S.filterStatus==='gereed' && !i.gereed) return false;
  if(S.filterStatus==='verhaal' && !i.verhaal_op_derden) return false;
  if(S.filterStatus==='nood' && !noodOpen(i)) return false;
  if(S.filterPolis==='geen' && i.polis) return false;
  if(S.filterPolis && S.filterPolis!=='geen' && i.polis!==S.filterPolis) return false;
  if(S.zoek){
    const woorden=S.zoek.toLowerCase().split(' ').filter(Boolean);
    const tekst=[i.schade_id,i.locatie,i.omschrijving,i.opmerkingen,i.schadecategorie,i.uitgevoerd_door,i.verhaal_bedrijf,i.polis]
      .map(v=>String(v==null?'':v).toLowerCase()).join(' | ');
    if(!woorden.every(w=>tekst.includes(w))) return false;
  }
  return true;
}

function afdGroepen(){
  // afdelingen uit de gedeelde bouwplanning-tabellen, gegroepeerd per locatie
  const volgorde = ['EW2','EW4','EW5','3T36','3T38','OVERIG'];
  const groepen = {};
  (S.data && S.data.afdelingen || []).forEach(a=>{
    const loc = String(a.loc||'OVERIG');
    if(!groepen[loc]) groepen[loc] = [];
    if(!groepen[loc].includes(a.afd)) groepen[loc].push(a.afd);
  });
  const namen = Object.keys(groepen).sort((a,b)=>{
    const ia = volgorde.indexOf(a), ib = volgorde.indexOf(b);
    return (ia<0?99:ia)-(ib<0?99:ib) || a.localeCompare(b);
  });
  namen.forEach(n=>groepen[n].sort((x,y)=>{
    const nx=parseInt(x,10), ny=parseInt(y,10);
    if(!isNaN(nx) && !isNaN(ny) && nx!==ny) return nx-ny;
    if(!isNaN(nx) && isNaN(ny)) return -1;
    if(isNaN(nx) && !isNaN(ny)) return 1;
    return String(x).localeCompare(String(y));
  }));
  return namen.map(n=>({ loc:n, afdelingen:groepen[n] }));
}

function veldFull(label,name,val,type){
  if(type==='textarea') return '<label class="veld">'+esc(label)+'</label><textarea data-veld="'+name+'">'+esc(val||'')+'</textarea>';
  return '<label class="veld">'+esc(label)+'</label><input type="text" data-veld="'+name+'" value="'+esc(val||'')+'">';
}
function leesAlsBase64(file){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>resolve(String(r.result).split(',')[1]);
    r.onerror=reject;
    r.readAsDataURL(file);
  });
}
function koppelItems(root){
  root.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>{
    const id=+el.dataset.open;
    S.open = S.open===id ? null : id;
    if(S.open===null) S.meerOpen=null;
    render();
  });
  root.querySelectorAll('[data-sluit]').forEach(b=>b.onclick=(e)=>{e.stopPropagation();S.open=null;S.meerOpen=null;render();});
  root.querySelectorAll('[data-print]').forEach(b=>b.onclick=(e)=>{e.stopPropagation();printItem(+b.dataset.print);});
  root.querySelectorAll('[data-dlfoto]').forEach(b=>b.onclick=(e)=>{e.preventDefault();e.stopPropagation();downloadBestand(b.dataset.dlfoto);});
  root.querySelectorAll('[data-dlalle]').forEach(b=>b.onclick=(e)=>{e.preventDefault();e.stopPropagation();downloadAlle(+b.dataset.dlalle);});
  root.querySelectorAll('[data-fotoupload]').forEach(inp=>inp.onclick=(e)=>e.stopPropagation());
  root.querySelectorAll('[data-lightbox]').forEach(a=>a.onclick=(e)=>{
    e.preventDefault(); e.stopPropagation();
    const itemId=+a.dataset.lightbox;
    const idx=+a.dataset.idx;
    const i=S.data.items.find(x=>x.id===itemId);
    if(!i) return;
    openLightbox(fotoLijst(i), idx);
  });
  root.querySelectorAll('[data-fotoupload]').forEach(inp=>inp.onchange=async(e)=>{
    e.stopPropagation();
    const itemId=+inp.dataset.fotoupload;
    const files=Array.from(inp.files||[]);
    if(!files.length) return;
    const status=document.querySelector('[data-uploadstatus="'+itemId+'"]');
    const i=S.data.items.find(x=>x.id===itemId);
    const bestaand=fotoLijst(i);
    let ok=0;
    for(const f of files){
      if(status) status.textContent='bezig… ('+(ok+1)+'/'+files.length+')';
      try{
        const b64=await leesAlsBase64(f);
        await api({action:'upload_foto', filename:f.name, content_type:f.type||'image/jpeg', content_base64:b64});
        if(!bestaand.includes(f.name)) bestaand.push(f.name);
        ok++;
      }catch(err){ toast('Upload mislukt: '+f.name); }
    }
    if(ok>0){
      await doe({action:'item_update', id:itemId, fields:{foto_referenties: bestaand.join(', ')}}, ok+' foto(s) toegevoegd aan '+i.schade_id+' door '+S.wie);
    }
  });
  root.querySelectorAll('[data-opslaan]').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    const id=+b.dataset.opslaan;
    const item=document.querySelector('.item[data-id="'+id+'"]');
    const fields={};
    item.querySelectorAll('[data-veld]').forEach(inp=>{
      const v = inp.type==='checkbox' ? inp.checked : inp.value;
      fields[inp.dataset.veld]=v;
    });
    const i=S.data.items.find(x=>x.id===id);
    doe({action:'item_update',id, fields}, i.schade_id+' bijgewerkt door '+S.wie);
  });
  root.querySelectorAll('[data-verhaaltoggle]').forEach(cb=>cb.onchange=(e)=>{
    e.stopPropagation();
    const itemId=cb.dataset.verhaaltoggle;
    const blok=document.querySelector('[data-verhaalblok="'+itemId+'"]');
    if(blok) blok.style.display = cb.checked ? 'block' : 'none';
  });
  root.querySelectorAll('[data-vulbedrijf]').forEach(chip=>chip.onclick=(e)=>{
    e.stopPropagation();
    const naam=chip.dataset.vulbedrijf;
    const detail=chip.closest('.detail');
    const inp=detail.querySelector('[data-veld="uitgevoerd_door"]');
    if(inp) inp.value=naam;
    const groep=chip.closest('[data-bchips]');
    if(groep) groep.querySelectorAll('.bchip').forEach(c=>c.classList.toggle('gekozen', c===chip));
  });
  root.querySelectorAll('[data-bedrijf-toevoegen]').forEach(btn=>btn.onclick=async(e)=>{
    e.stopPropagation();
    const itemId=+btn.dataset.bedrijfToevoegen;
    const inp=document.querySelector('[data-nieuw-bedrijf="'+itemId+'"]');
    const naam=(inp&&inp.value||'').trim();
    if(!naam){ toast('Vul een bedrijfsnaam in'); return; }
    await doe({action:'bedrijf_add', naam}, 'Nieuw bedrijf toegevoegd: '+naam);
    const item=document.querySelector('.item[data-id="'+itemId+'"]');
    const bedrijfInp=item && item.querySelector('[data-veld="uitgevoerd_door"]');
    if(bedrijfInp) bedrijfInp.value=naam;
  });
  root.querySelectorAll('[data-vulverhaalbedrijf]').forEach(chip=>chip.onclick=(e)=>{
    e.stopPropagation();
    const naam=chip.dataset.vulverhaalbedrijf;
    const detail=chip.closest('.detail');
    const inp=detail.querySelector('[data-veld="verhaal_bedrijf"]');
    if(inp) inp.value=naam;
    const groep=chip.closest('[data-vbchips]');
    if(groep) groep.querySelectorAll('.bchip').forEach(c=>c.classList.toggle('gekozen', c===chip));
  });
  root.querySelectorAll('[data-verhaalbedrijf-toevoegen]').forEach(btn=>btn.onclick=async(e)=>{
    e.stopPropagation();
    const itemId=+btn.dataset.verhaalbedrijfToevoegen;
    const inp=document.querySelector('[data-nieuw-verhaalbedrijf="'+itemId+'"]');
    const naam=(inp&&inp.value||'').trim();
    if(!naam){ toast('Vul een bedrijfsnaam in'); return; }
    await doe({action:'bedrijf_add', naam}, 'Nieuw bedrijf toegevoegd: '+naam);
    const item=document.querySelector('.item[data-id="'+itemId+'"]');
    const inp2=item && item.querySelector('[data-veld="verhaal_bedrijf"]');
    if(inp2) inp2.value=naam;
  });
  root.querySelectorAll('[data-vulloc]').forEach(chip=>chip.onclick=(e)=>{
    e.stopPropagation();
    const loc=chip.dataset.vulloc, afd=chip.dataset.vulafd;
    const detail=chip.closest('.detail');
    const tekstInp=detail.querySelector('[data-veld="locatie"]');
    const locInp=detail.querySelector('[data-veld="locatie_code"]');
    const afdInp=detail.querySelector('[data-veld="afdeling_code"]');
    const alGekozen = chip.classList.contains('gekozen');
    if(alGekozen){
      if(locInp) locInp.value='';
      if(afdInp) afdInp.value='';
    } else {
      if(tekstInp) tekstInp.value=locTekst(loc,afd);
      if(locInp) locInp.value=loc;
      if(afdInp) afdInp.value=afd;
    }
    const wolk=chip.closest('[data-locwolk]');
    if(wolk) wolk.querySelectorAll('.bchip').forEach(c=>c.classList.toggle('gekozen', c===chip && !alGekozen));
  });
  root.querySelectorAll('[data-vulpolis]').forEach(chip=>chip.onclick=(e)=>{
    e.stopPropagation();
    const naam=chip.dataset.vulpolis;
    const detail=chip.closest('.detail');
    const inp=detail.querySelector('[data-veld="polis"]');
    if(inp) inp.value = (inp.value===naam) ? '' : naam;
    const groep=chip.closest('[data-polischips]');
    if(groep) groep.querySelectorAll('.bchip').forEach(c=>c.classList.toggle('gekozen', c===chip && inp && inp.value===naam));
  });
  root.querySelectorAll('[data-vulcategorie]').forEach(chip=>chip.onclick=(e)=>{
    e.stopPropagation();
    const naam=chip.dataset.vulcategorie;
    const detail=chip.closest('.detail');
    const inp=detail.querySelector('[data-veld="schadecategorie"]');
    if(inp) inp.value=naam;
    const groep=chip.closest('[data-catchips]');
    if(groep) groep.querySelectorAll('.bchip').forEach(c=>c.classList.toggle('gekozen', c===chip));
  });
  root.querySelectorAll('[data-categorie-toevoegen]').forEach(btn=>btn.onclick=async(e)=>{
    e.stopPropagation();
    const itemId=+btn.dataset.categorieToevoegen;
    const inp=document.querySelector('[data-nieuw-categorie="'+itemId+'"]');
    const naam=(inp&&inp.value||'').trim();
    if(!naam){ toast('Vul een categorienaam in'); return; }
    await doe({action:'schadecategorie_add', naam}, 'Nieuwe schadecategorie toegevoegd: '+naam);
    const item=document.querySelector('.item[data-id="'+itemId+'"]');
    const catInp=item && item.querySelector('[data-veld="schadecategorie"]');
    if(catInp) catInp.value=naam;
  });
  root.querySelectorAll('[data-gereed-toggle]').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    volgendeStand(+b.dataset.gereedToggle);
  });
}

function rPerBedrijf(app){
  const items=S.data.items.filter(i=>i.categorie!=='steun');
  const groepen={};
  items.forEach(i=>{
    const naam=(i.uitgevoerd_door||'').trim() || 'Nog geen bedrijf toegewezen';
    if(!groepen[naam]) groepen[naam]={open:[],gereed:0};
    if(i.gereed) groepen[naam].gereed++;
    else groepen[naam].open.push(i);
  });
  const namen=Object.keys(groepen).sort((a,b)=>{
    if(a==='Nog geen bedrijf toegewezen') return -1;
    if(b==='Nog geen bedrijf toegewezen') return 1;
    return groepen[b].open.length-groepen[a].open.length || a.localeCompare(b);
  });
  let h='<div class="stil" style="margin-bottom:8px">Openstaande taken per bedrijf — tik op een item om te openen.</div>';
  h+=namen.map(naam=>{
    const g=groepen[naam];
    let hh='<div class="kaart"><h2>'+esc(naam)+' — '+g.open.length+' open'+(g.gereed?' · '+g.gereed+' gereed':'')+'</h2>';
    if(!g.open.length){ hh+='<div class="leeg">Niets openstaand.</div>'; }
    else{
      hh+=g.open.map(i=>'<div class="pb-item" data-openitem="'+i.id+'">'
        +'<span class="id">'+esc(i.schade_id)+'</span>'
        +(i.schadecategorie?'<span class="chip cat-badge">'+esc(i.schadecategorie)+'</span>':'')
        +(i.polis?'<span class="chip cat-badge" style="background:#8a5a3b">'+esc(i.polis)+'</span>':'')
        +'<span class="oms">'+esc(i.locatie||i.omschrijving||'')+'</span>'
        +(i.verhaal_op_derden?'<span class="stadium status-verhaal">Verhaal op: '+(i.verhaal_bedrijf?esc(i.verhaal_bedrijf):'nog invullen')+'</span>':'')
        +standKnop(i)
        +'</div>').join('');
    }
    hh+='</div>';
    return hh;
  }).join('');
  app.innerHTML=h;
  koppelPerBedrijf(app);
}
function koppelPerBedrijf(root){
  root.querySelectorAll('[data-openitem]').forEach(el=>el.onclick=(e)=>{
    if(e.target.closest('[data-gereed-toggle]')) return;
    const id=+el.dataset.openitem;
    S.view='items'; S.open=id; render(); window.scrollTo(0,0);
  });
  root.querySelectorAll('[data-gereed-toggle]').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    volgendeStand(+b.dataset.gereedToggle);
  });
}

function rLogboek(app){
  const log=S.data.logboek||[];
  let h='<div class="kaart"><details class="log" open><summary>Laatste wijzigingen ('+log.length+')</summary>';
  h+=log.length? log.map(r=>'<div class="regel"><span>'+esc(r.actie)+'</span><span class="stil">'+esc((r.wie||'')+' · '+String(r.ts).slice(5,16).replace('T',' '))+'</span></div>').join('') : '<div class="leeg">Nog geen wijzigingen.</div>';
  h+='</details></div>';
  app.innerHTML=h;
}

async function start(){
  if(!S.code){ toonLogin(); return; }
  try{ await laad(); render(); }
  catch(e){ if(e.auth) toonLogin(); else { document.getElementById('app').innerHTML='<div class="leeg">Kan de data niet laden — check je internetverbinding en ververs de pagina.</div>'; } }
}
function toonLogin(){
  const lg=document.getElementById('login'); lg.style.display='flex';
  document.getElementById('lg-knop').onclick=async()=>{
    S.code=document.getElementById('lg-code').value.trim();
    S.wie=document.getElementById('lg-wie').value;
    try{ await laad();
      localStorage.setItem('si_code',S.code); localStorage.setItem('si_wie',S.wie);
      lg.style.display='none'; render();
    }catch(e){ document.getElementById('lg-fout').style.display='block'; }
  };
}
setInterval(async()=>{ if(S.data&&document.visibilityState==='visible'){ try{ await laad(); render(); }catch(e){} } }, 90000);
document.addEventListener('visibilitychange',async()=>{ if(document.visibilityState==='visible'&&S.data){ try{ await laad(); render(); }catch(e){} } });
initLightbox();
start();
</script>
